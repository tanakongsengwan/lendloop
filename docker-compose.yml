# n8n for LendLoop. Usage:
#   cp n8n/.env.example n8n/.env   # fill in secrets
#   docker compose up -d
# The one-shot `n8n-import` service imports the workflows in ./n8n on first start
# (delete the volume or the marker file to re-import).
# Pinned to the 1.x line the exported workflows were written for.

x-n8n: &n8n
  image: docker.n8n.io/n8nio/n8n:1.123.93
  env_file: ./n8n/.env
  environment:
    GENERIC_TIMEZONE: ${TZ:-Asia/Bangkok}
    TZ: ${TZ:-Asia/Bangkok}
    # Code nodes use Node's crypto for HMAC and read secrets from env vars.
    NODE_FUNCTION_ALLOW_BUILTIN: crypto
    N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    N8N_DIAGNOSTICS_ENABLED: "false"
    N8N_PERSONALIZATION_ENABLED: "false"
    N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    WEBHOOK_URL: ${N8N_PUBLIC_URL:-http://localhost:5678/}
  volumes:
    - n8n_data:/home/node/.n8n
    - ./n8n:/workflows:ro

services:
  n8n-import:
    <<: *n8n
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        if [ -f /home/node/.n8n/.lendloop-imported ]; then
          echo "LendLoop workflows already imported"; exit 0;
        fi;
        for f in /workflows/*.json; do
          n8n import:workflow --input="$$f" || exit 1;
        done;
        touch /home/node/.n8n/.lendloop-imported
    restart: "no"

  n8n:
    <<: *n8n
    ports:
      - "5678:5678"
    restart: unless-stopped
    depends_on:
      n8n-import:
        condition: service_completed_successfully

volumes:
  n8n_data:
